# The project's server and its database, running in containers on this computer.
#
#   ./gradlew :server:installDist      build the server
#   docker compose up --build -d       start PostgreSQL and the server
#   curl http://localhost:8080/health  check that both are up
#   docker compose down                stop (the data stays in the "db-data" volume)
#
# The app uses http://localhost:8080; run "adb reverse tcp:8080 tcp:8080" so that the
# emulator's (or a USB phone's) localhost leads here.
# The passwords below are for local development only. For anything else, put real values in a
# .env file next to this one (it is not committed); see .env.example.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: drivemetrics
      POSTGRES_USER: drivemetrics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drivemetrics-local}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # only reachable from this computer, for database tools
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivemetrics -d drivemetrics"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/drivemetrics
      DATABASE_USER: drivemetrics
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-drivemetrics-local}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-0123456789}
      # demo@drivemetrics.app / demo1234, for trying the app
      SEED_DEMO_ACCOUNT: "true"
      # road reports of "other drivers" along the demo routes
      SEED_DEMO_REPORTS: "true"
      # the key the support team types on http://localhost:8080/support
      SUPPORT_AGENT_KEY: ${SUPPORT_AGENT_KEY:-local-support-key}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
